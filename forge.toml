# Atelier installer -- built with Forge (https://github.com/fezcode/Forge)
#
#   .\build-installer.ps1          publish + build dist/Atelier-Setup-<version>.exe
#
# Keep [app] version in step with <Version> in Atelier.csproj.

[app]
name    = "Atelier"
version = "0.3.1"
id      = "com.fezcode.atelier"
icon    = "Assets/atelier-icon.ico"

[meta]
publisher   = "Fezcode"
homepage    = "https://github.com/fezcode/Atelier"
support_url = "https://github.com/fezcode/Atelier/issues"
comments    = "A modern, high-performance image and SVG viewer built with Avalonia UI and Magick.NET."

[ui]
# mica = the Windows 11 look, so setup feels native rather than branded.
theme        = "mica"
window_title = "Atelier ${app.version} Setup"

[install]
# Program Files, matching Descry and Timp -- and matching where the old Lua
# installer put Atelier 0.2.78, so an upgrade replaces that copy instead of
# leaving two installs side by side. Forge elevates automatically for this path.
# File associations stay per-user (HKCU) regardless of where the app lives.
default_dir = "${PROGRAMFILES}/Atelier"

[uninstall]
keep          = []
settings_dirs = ["${APPDATA}/fezcode/Atelier"]   # offered as "Also remove my settings and data"
progids       = ["Atelier*"]                      # AtelierPNG, AtelierJPG, ... written by "Set as default viewer"

# --- wizard -----------------------------------------------------------------

[[steps]]
type  = "welcome"
title = "Atelier ${app.version}"
body  = "This will install Atelier ${app.version} on your computer.\n\nAtelier is a fast, minimal viewer for raster images, SVG and HEIC/AVIF photos.\n\nClick Next to continue."

[[steps]]
type           = "license"
title          = "License Agreement"
body           = "Please review the license terms below before continuing."
file           = "LICENSE.txt"
require_scroll = true

# Every step needs an explicit title and body: the themes render
# step.title/step.body directly, so a step without them draws a blank pane --
# which is what the install step did before.
[[steps]]
type  = "folder"
title = "Select Folder"
body  = "Choose where to install Atelier ${app.version}."

[[steps]]
type  = "shortcuts"
title = "Select Optional Tasks"
body  = "Check the items you would like the installer to perform."

[[steps]]
type  = "install"
title = "Installing..."
body  = "Copying files to your system."

[[steps]]
type  = "finish"
title = "Installation Complete"
body  = "Atelier has been installed successfully.\n\nYou can set which file types open with Atelier from File -> File Associations."

[[steps.launches]]
kind    = "app"
target  = "${INSTALLDIR}/Atelier.exe"
label   = "Launch Atelier"
checked = true

# --- payload ----------------------------------------------------------------

# The whole self-contained publish output. Produced by publish.ps1 -- deliberately
# NOT single-file, so the runtime has nothing to unpack into %TEMP% on first launch.
[[dirs]]
src = "Publish"
dst = "${INSTALLDIR}"

[[files]]
src = "LICENSE.txt"
dst = "${INSTALLDIR}/LICENSE.txt"

[[files]]
src = "README.md"
dst = "${INSTALLDIR}/README.md"

# --- shortcuts --------------------------------------------------------------

[[shortcuts]]
target   = "${INSTALLDIR}/Atelier.exe"
location = "${DESKTOP}"
name     = "Atelier"
icon     = "${INSTALLDIR}/Atelier.exe"
label    = "Create a desktop shortcut"
optional = true
default  = true

[[shortcuts]]
target   = "${INSTALLDIR}/Atelier.exe"
location = "${STARTMENU}/Fezcode"
name     = "Atelier"
icon     = "${INSTALLDIR}/Atelier.exe"
label    = "Create a Start Menu entry"
optional = true
default  = true

# --- registry ---------------------------------------------------------------

[[registry]]
hive  = "HKCU"
key   = "Software\\Fezcode\\Atelier"
value = "InstallDir"
data  = "${INSTALLDIR}"

[[registry]]
hive  = "HKCU"
key   = "Software\\Fezcode\\Atelier"
value = "Version"
data  = "${app.version}"
